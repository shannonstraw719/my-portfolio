<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header class="app-header">
            <p class="eyebrow">MY VERY FIRST SOFTWARE PROJECT</p>
            <h1>Task Manager</h1>
            <p class="subtitle">
                Organize your tasks and keep track of what needs to get done.
            </p>
        </header>


        <section class="task-input">

    <input
        type="text"
        id="taskInput"
        placeholder="What needs to be done?"
        aria-label="Enter a new task"
    >

    <input
        type="date"
        id="dueDateInput"
        aria-label="Choose a due date"
    >

    <button id="addTaskButton">
        Add Task
    </button>

</section>


        <section class="task-controls">

            <button class="filter-button active" data-filter="all">
                All
            </button>

            <button class="filter-button" data-filter="active">
                Active
            </button>

            <button class="filter-button" data-filter="completed">
                Completed
            </button>

        </section>


        <section class="task-list-section">

    <div class="task-summary">
        <span id="taskCount">0 tasks remaining</span>

        <button id="clearCompletedButton">
            Clear Completed
        </button>
    </div>

    <ul id="taskList">
        <!-- Tasks will be added here with JavaScript -->
    </ul>

    <p id="emptyMessage">
        No tasks yet. Add one above!
    </p>

</section>

        <footer>
            <p>
                Built with HTML, CSS, and JavaScript - Created by Shannon S. 2026
            </p>
        </footer>

    </main>


    <script src="script.js"></script>

</body>
</html>
